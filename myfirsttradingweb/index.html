<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CuShin VIP Signal - BTC Trend Follower</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-4 sm:p-6">

  <div class="max-w-7xl mx-auto">
    <!-- Header -->
    <header class="flex flex-col sm:flex-row justify-between items-start sm:items-center pb-6 mb-6 border-b border-slate-800 gap-4">
      <div>
        <h1 class="text-2xl sm:text-3xl font-extrabold bg-gradient-to-r from-emerald-400 via-teal-300 to-cyan-400 bg-clip-text text-transparent">
          ⚡ CuShin Pro Trend Signals
        </h1>
        <p class="text-xs sm:text-sm text-slate-400 mt-1">Lọc tín hiệu Altcoins theo BTC Trend · Phân bổ Entry DCA (40/60) · Chốt lời TP1-TP3</p>
      </div>
      <div class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-900 border border-slate-800 text-xs">
        <span id="status-dot" class="w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse"></span>
        <span id="status-text" class="text-slate-400 font-medium">Đang kết nối Realtime...</span>
      </div>
    </header>

    <!-- Grid chứa thẻ tín hiệu -->
    <main>
      <div id="signals-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
        <div class="col-span-full text-center py-16 bg-slate-900/40 rounded-2xl border border-slate-800">
          <p class="text-slate-400">Đang đồng bộ tín hiệu...</p>
        </div>
      </div>
    </main>
  </div>

  <script>
    const firebaseConfig = {
      databaseURL: "https://webtrade-85ca8-default-rtdb.asia-southeast1.firebasedatabase.app"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);

    const dbRef = firebase.database().ref('signals');
    const signalsGrid = document.getElementById('signals-grid');

    dbRef.on('value', (snapshot) => {
      document.getElementById('status-dot').className = "w-2.5 h-2.5 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.8)]";
      document.getElementById('status-text').className = "text-emerald-400 font-medium";
      document.getElementById('status-text').innerText = "Trực tuyến (Realtime)";
      render(snapshot.val());
    });

    function render(data) {
      if (!data || Object.keys(data).length === 0) {
        signalsGrid.innerHTML = `
          <div class="col-span-full text-center py-16 bg-slate-900/40 rounded-2xl border border-slate-800">
            <p class="text-slate-400 font-medium">Không có Altcoin nào trùng khớp với Trend chính của BTC lúc này.</p>
            <p class="text-slate-600 text-xs mt-1">Đang chờ tín hiệu an toàn tiếp theo...</p>
          </div>`;
        return;
      }

      signalsGrid.innerHTML = '';
      Object.values(data).forEach(item => {
        const isBuy = item.signal.includes("BUY");
        const cardBorder = isBuy ? 'border-emerald-500/30 hover:border-emerald-500/60' : 'border-rose-500/30 hover:border-rose-500/60';
        const badgeBg = isBuy ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' : 'bg-rose-500/10 text-rose-400 border-rose-500/20';

        const cardHTML = `
          <div class="bg-slate-900 rounded-2xl p-5 border ${cardBorder} transition-all duration-300 shadow-xl flex flex-col justify-between">
            <div>
              <div class="flex justify-between items-start mb-3">
                <div>
                  <span class="text-xl font-bold text-slate-100">${item.symbol}</span>
                  <span class="text-xs text-slate-400 block">${item.trade_timeframe}</span>
                </div>
                <span class="${badgeBg} px-3 py-1 rounded-full text-xs font-bold border">
                  ${item.signal}
                </span>
              </div>

              <!-- Entries & DCA -->
              <div class="bg-slate-950/80 rounded-xl p-3.5 space-y-2 mb-4 border border-slate-800">
                <div class="text-[11px] font-semibold text-cyan-400 mb-1">⚖️ Chia Vol: ${item.vol_split}</div>
                <div class="flex justify-between text-sm">
                  <span class="text-slate-400">Entry 1:</span>
                  <span class="mono font-semibold text-slate-200">${item.entry_1}</span>
                </div>
                <div class="flex justify-between text-sm">
                  <span class="text-slate-400">Entry DCA:</span>
                  <span class="mono font-semibold text-amber-400">${item.entry_dca}</span>
                </div>
                <div class="flex justify-between text-sm pt-1 border-t border-slate-800">
                  <span class="text-slate-400">Stop Loss:</span>
                  <span class="mono font-semibold text-rose-400">${item.stop_loss}</span>
                </div>
              </div>

              <!-- Target Profits -->
              <div class="bg-slate-950/40 rounded-xl p-3 space-y-1.5 mb-4 border border-slate-800/50 text-xs">
                <div class="flex justify-between">
                  <span class="text-slate-400">TP 1 (50% Vol):</span>
                  <span class="mono text-emerald-400 font-medium">${item.tp1}</span>
                </div>
                <div class="flex justify-between">
                  <span class="text-slate-400">TP 2 (30% Vol):</span>
                  <span class="mono text-emerald-400 font-medium">${item.tp2}</span>
                </div>
                <div class="flex justify-between">
                  <span class="text-slate-400">TP 3 (20% Vol):</span>
                  <span class="mono text-emerald-400 font-medium">${item.tp3}</span>
                </div>
              </div>

              <div class="flex justify-between items-center text-xs text-slate-400 mb-3 px-1">
                <span>Đòn bẩy: <strong class="text-slate-200">${item.leverage}x</strong></span>
                <span>Margin: <strong class="text-slate-200">${item.margin_pct}% TK</strong></span>
              </div>
            </div>

            <div class="pt-3 border-t border-slate-800 text-xs">
              <p class="text-slate-300">💡 <b>Cơ sở:</b> ${item.reason}</p>
              <div class="mt-2 text-[10px] text-slate-500 text-right mono">${item.time_str}</div>
            </div>
          </div>
        `;
        signalsGrid.innerHTML += cardHTML;
      });
    }
  </script>
</body>
</html>
